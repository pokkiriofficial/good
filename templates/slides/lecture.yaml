# ③ 対面レクチャー資料の中身(章の名前・目安時間・同席者は spec/items.yaml の chapters)
#
# 13章を6つのまとまり(parts)に分け、1まとまり2〜3枚で進める。
# 操作スライド(kind: ops)は、1枚に操作を1〜2つ並べる。各操作は3段構成。
#   chapter … どの章の操作か(章を除外すると、その操作も消える)
#   steps   … 手順(3〜5行)
#   screen  … slides/images/ に置くスクリーンショットのファイル名(差し替え用)
#   try     … やってみよう
# checks は、その章の最後の操作があるスライドの「できたらチェック」と、当日チェックリストに出す。
# [ ] で囲んだ所は、訪問前に導入担当が書き換える。

checks:
  1: [許可証を登録した, オーナーと店長がログインできた]
  2: [すべての卓を配置した]
  3: [1卓を会計まで通しでできた]
  4: [キャストの付け方と付け替えができた]
  5: [バックのルールを設定した]
  6: [テスト会計の金額が正しかった]
  7: [訂正と取消の手順を確認した]
  8: [プリンターで領収書が出た]
  9: [キッチン伝票が厨房で出た]
  10: [レジ開けからレジ締めまでできた]
  11: [全キャストが登録済み, キャストごとのバックが入っている]
  12: [出勤・退勤の打刻ができた]

parts:
  - title: 最初の準備と卓の配置
    chapters: [1, 2]
    slides:
      - kind: ops
        title: 許可証とログインの準備
        ops:
          - chapter: 1
            title: 許可証を撮影する
            steps: [控えを用意する, 設定の「許可証」を開く, 撮影して、有効期限を入れる]
            screen: 01-license.png
            try: 風営法の許可証を1枚登録する
          - chapter: 1
            title: IDとパスワードを決める
            steps: [オーナーの分を、その場で決める, 紙やLINEには残さない, スタッフの分も作る]
            screen: 01-login.png
            try: 店長のIDでログインし直す
      - kind: ops
        title: 権限と卓の配置
        ops:
          - chapter: 1
            title: スタッフの権限を分ける
            steps: [「メンバー」から権限を開く, 取消や給与を見られる人を決める, キャストは打刻だけにする]
            screen: 01-permission.png
            try: スタッフ1人を「一般」にする
          - chapter: 2
            title: 卓をフロアマップに並べる
            steps: [「フロアマップ」を開く, 左に並んだ卓を選ぶ, 実際の配置どおりにドラッグする]
            screen: 02-floormap.png
            try: VIP席を奥に動かす

  - title: 接客とキャストの付け方
    chapters: [3, 4]
    slides:
      - kind: ops
        title: セットを始めて、延長をつける
        ops:
          - chapter: 3
            title: 入店とセット開始
            steps: [卓をタップする, 人数とセットを選ぶ, 「開始」で時間が動き出す]
            screen: 03-start.png
            try: VIP1で2名・セット1を始める
          - chapter: 3
            title: 延長をつける
            steps: [卓をタップする, 「延長」から時間を選ぶ, 伝票の合計が増えたか見る]
            screen: 03-extension.png
            try: VIP1に延長30分をつける
      - kind: ops
        title: 指名・注文から会計まで
        ops:
          - chapter: 3
            title: 指名と注文を追加する
            steps: [卓の伝票を開く, 「指名」でキャストと区分を選ぶ, 「注文」で商品を選ぶ]
            screen: 03-order.png
            try: 本指名とシャンパンを1本つける
          - chapter: 3
            title: 会計する
            steps: [「会計」を押す, 支払い方法を選ぶ, お預かり金額を入れて確定する]
            screen: 03-checkout.png
            try: VIP1を現金で会計する
      - kind: ops
        title: キャストの付け方
        ops:
          - chapter: 4
            title: キャストを卓に付ける
            steps: [卓の「キャスト」を開く, 名前と区分を選ぶ, 付いた時刻は自動で残ります]
            screen: 04-assign.png
            try: ココを本指名、りんをヘルプで付ける
          - chapter: 4
            title: 付け替えと売上の折半
            steps: [名前を長押しして、別の卓へ移す, 折半は2人選んで割合を決める, 売上の付き方を画面で見る]
            screen: 04-split.png
            try: 本指名の売上を半分ずつにする

  - title: バック・テスト会計・訂正
    chapters: [5, 6, 7]
    slides:
      - kind: table
        chapter: 5
        title: バックは10パターンから選びます
        columns: [パターン, 内容]
        rows:
          - [① 指名バック, 指名ごとに、円か指名料の%で支給]
          - [② 担当卓売上バック, 担当した卓の売上の%]
          - [③ 商品バック, 特定の商品を出したキャストに支給]
          - [④ ボトル折半, ボトル1本を、付いたキャストで分ける]
          - [⑤ スライド, 月間の実績で率が上がる]
          - [⑥ 時給併用, 時給に①〜⑤を上乗せ]
          - [⑦ 保証比較, 日給保証と①〜⑥の高い方]
          - [⑧ ポイント時給, ポイントで時給が変わる]
          - [⑨ 本数ボーナス, 月の指名本数で固定ボーナス]
          - [⑩ ヘルプバック, 他のルールに係数をかけてヘルプへ]
      - kind: ops
        title: バックを設定して、テスト会計
        ops:
          - chapter: 5
            title: お店のルールを設定する
            steps: [今の決め方を口頭で伺う, 近いパターンを選ぶ, 率や金額を入れる]
            screen: 05-back.png
            try: 本指名バック1,000円を設定する
          - chapter: 6
            title: 金額で答え合わせする
            steps: [練習用の卓で会計する, 現金とカードで1回ずつ, サービス料・端数・税を手計算と比べる]
            screen: 06-test.png
            try: カード払いの手数料を確かめる
      - kind: ops
        title: 伝票を直す・取り消す
        ops:
          - chapter: 7
            title: 訂正と取消
            steps: [会計済みの伝票を「履歴」から開く, 「訂正」で直すか、「取消」で消す, 権限のある人だけが操作できます]
            screen: 07-void.png
            try: テスト伝票を取り消す

  - title: プリンターとキッチン伝票
    chapters: [8, 9]
    slides:
      - kind: ops
        title: プリンターの準備
        ops:
          - chapter: 8
            title: つないで試し刷り
            steps: [電源を入れ、同じWi-Fiにつなぐ, 「プリンター設定」で機器を選ぶ, 「試し刷り」を押す]
            screen: 08-printer.png
            try: 試し刷りを1枚出す
          - chapter: 8
            title: 用紙交換と領収書
            steps: [紙の向きをそろえて入れる, 領収書のデザインを実物で決める, 宛名と但し書きを入れて刷る]
            screen: 08-receipt.png
            try: 領収書を1枚印刷する
      - kind: ops
        title: 注文を厨房に印刷する
        ops:
          - chapter: 9
            title: キッチン伝票
            steps: [フロアで注文を入れる, 選んだカテゴリーだけ厨房で印刷されます, 出したら「提供済み」を付ける]
            screen: 09-kitchen.png
            try: 唐揚げを注文して、厨房で印刷する

  - title: レジ・メンバー登録・打刻
    chapters: [10, 11, 12]
    slides:
      - kind: ops
        title: レジを開けて、締める
        ops:
          - chapter: 10
            title: レジを開ける
            steps: [営業前に「レジ開け」を押す, 釣銭準備額を確かめて入れる, これで会計ができます]
            screen: 10-open.png
            try: レジ金50,000円で開ける
          - chapter: 10
            title: レジを締める
            steps: [営業後に「レジ締め」を押す, お札と硬貨の枚数を入れる, 過不足が出たら理由をメモする]
            screen: 10-close.png
            try: レジを締めて、日報を出す
      - kind: ops
        title: メンバーを登録する
        ops:
          - chapter: 11
            title: 時給やバックはお店が入力
            steps: [「メンバー」からキャストを開く, 時給・ランク・源泉区分を入れる, 「バック(個人ごと)」で率を入れる, 最初の1〜2人は一緒に入れます]
            screen: 11-pay.png
            try: キャスト1人の時給を入れる
          - chapter: 11
            title: 個人情報は本人が入力
            steps: [本人に端末を渡す, 本名・連絡先・口座を本人が入れる, 身分証を店長が確認する]
            screen: 11-personal.png
            try: キャスト1人が自分の情報を入れる
      - kind: ops
        title: 出勤・退勤を打刻する
        ops:
          - chapter: 12
            title: 打刻と遅刻控除
            steps: [「打刻」で自分の名前を選ぶ, 「出勤」か「退勤」を押す, 遅刻は、決めたルールで自動で控除されます]
            screen: 12-clock.png
            try: キャスト1人が出勤を打刻する

  - title: 困ったとき
    chapters: [13]
    slides:
      - kind: faq
        chapter: 13
        title: 困ったときは
        contact:
          - 電話:[サポート窓口の電話番号]
          - 受付:[受付時間]
          - LINE:[サポート用LINEのID]
        faq:
          - [会計を間違えた, 「訂正と取消」の手順で直してください]
          - [プリンターが出ない, 電源とWi-Fiを確かめて、試し刷りをしてください]
          - [キャストが増えた, 「メンバーを登録する」と同じ手順で追加してください]
