# 契約フロー(契約〜導入日)の中身。社内と代理店向けの説明資料の元データ。
#
# ここを直して `python3 scripts/build_contract.py` を実行すると、
#   docs/contract_flow.md         … 説明ドキュメント
#   docs/images/contract/*.svg    … 図解
#   slides/contract.md            … スライド(Marp)
#   slides/contract.html          … ブラウザで開けるスライド(印刷してPDFにできる)
# が生成される。
#
# 書き方のルール(要件定義書 6章): 1行20〜35文字、読点は1文に1〜2個。
# ログインIDとパスワードの値・決め方は、この資料に書かない(訪問時に設定する)。

title: ポッキリ.Night 契約フロー
subtitle: 契約から導入日までの流れと料金
audience: 社内・代理店向け
company: KOKU

# ── 料金 ─────────────────────────────────────────
pricing:
  initial:
    new: {label: 新規, amount: 50000, tax: 税別}
    switch: {label: 乗り換え, amount: 0, tax: ""}
    note: 乗り換え(他社POSからの移行)は、初期費用がかかりません
  monthly:
    - {id: light, name: ライトプラン, amount: 30000, tax: 税込}
    - {id: standard, name: スタンダードプラン, amount: 50000, tax: 税込}
  tax_rate: 10   # 消費税率(%)。税別の金額に税込の参考額を添える

# 請求のルール(読み手に必ず伝える順に並べる)
billing_rules:
  - 月額は先払いです。月末に、翌月分の月額をいただきます
  - 契約月(導入月)は、新規は初期費用だけをいただきます
  - 乗り換えは初期費用が0円なので、契約月の請求はありません
  - 導入した翌月分の月額は無料です(実質1か月無料)
  - 月額の請求は、導入の翌月末に、翌々月分から始まります
  - 月初に導入しても月末に導入しても、ルールは同じです

# 請求の例(10月に導入した場合)。表と図に使う
# items が空の月末は「請求なし」
billing_example:
  install_month: 10
  free_month: 11
  months: [10, 11, 12]
  cases:
    - id: new
      label: 新規(初期費用あり)
      charges:
        - {when: 10月末, items: [初期費用]}
        - {when: 11月末, items: [12月分の月額]}
        - {when: 12月末, items: [1月分の月額]}
    - id: switch
      label: 乗り換え(初期費用0円)
      charges:
        - {when: 10月末, items: []}
        - {when: 11月末, items: [12月分の月額]}
        - {when: 12月末, items: [1月分の月額]}
  point: 11月分の月額は無料。請求は12月分から始まります

# ── 全体の流れ ──────────────────────────────────
# 契約日を0日目として、導入日までの目安
overview:
  - {id: contract, title: 契約, who: 店舗・KOKU, day: 当日, summary: LINEグループを作り、契約情報を記入する}
  - {id: setup, title: 準備, who: 店舗 → KOKU, day: 1〜4日目, summary: 店舗がフォームに記入し、KOKUが設定する}
  - {id: install, title: 導入日, who: 店舗・KOKU, day: 5日目が目安, summary: 店舗に伺い、約2時間で使える状態にする}
  - {id: live, title: 運用開始, who: 店舗, day: 導入日の営業から, summary: 月額の請求は、翌々月分から始まる}

# 契約日から導入日までのスケジュール(図に使う)
schedule:
  ideal: 初期セットアップフォームの記入日から、3日以内に導入する
  days:
    - {day: 0, label: 契約日, who: 店舗・KOKU, task: 契約・LINEグループ作成・フォーム送付}
    - {day: 1, label: 1日目, who: 店舗, task: 初期セットアップフォームに記入}
    - {day: 2, label: 2日目, who: 店舗, task: 記入の期限(契約日の2日後)}
    - {day: 3, label: 3日目, who: KOKU, task: アカウント作成・設定(2日で完成)}
    - {day: 4, label: 4日目, who: KOKU, task: 設定の仕上げ・導入日の最終確認}
    - {day: 5, label: 5日目, who: 店舗・KOKU, task: 導入日(店舗に伺う・約2時間)}
  tips:
    - 店舗には「本日フォームを送るので明日までに記入を」と伝える
    - 日程は店舗の忙しさで前後してよい。契約日の5日後がベスト
    - フォームの設定内容は、KOKU側で2日あれば完成できる

# ── 契約時(その場で) ─────────────────────────────
contract_steps:
  - title: LINEグループを作る
    detail: 店舗の担当者と、KOKUの担当を入れる
    members: [蓮さん, 秀美さん, 山中, 沢田]
  - title: 契約情報をその場で記入してもらう
    detail: 下の「お客様契約情報」の項目を、LINEグループに書いてもらう
  - title: 導入日(店舗に伺う日)を決める
    detail: 理想はフォーム記入日から3日以内。契約日の5日後がベスト

# LINEグループに書いてもらう項目(会社とお店の連絡先。キャストの個人情報は含めない)
contract_info:
  heading: 【ポッキリ.Night】お客様契約情報
  company: [会社名, 会社住所・郵便番号, 会社電話番号, 代表者]
  store: [店舗名, 店舗住所, 店舗電話番号, 担当者, メールアドレス]
  billing:
    - {label: 請求方法, options: [クレカ, 振込, 口座振替]}
    - {label: 無料期間, note: いつから請求が始まるかを書く}

# ── 契約後(KOKU側) ─────────────────────────────
after_contract_steps:
  - title: 初期セットアップフォームを送る
    detail: 契約日に必ず、LINEグループで送る。送信後2日以内に記入してもらう
    url: https://pokkiri-night-survey.vercel.app
    notes:
      - 商品メニューとキャスト情報は、店舗の方がPOSへ入力する
      - 商品メニューは、カテゴリー・商品名・販売価格・バックの4つ
      - 入力のやり方は、導入日に教える
  - title: 運営コンソールでアカウントを作る
    detail: その店舗の名前で「新規追加」を押し、IDとパスワードを設定する
    notes:
      - IDは店舗の名前を使う
      - パスワードの決め方は社内ルールに従い、この資料やLINEには書かない
  - title: フォームの回答を取り込み、設定を作る
    detail: 回答をコンソールに貼り付けて取り込み、導入日までに設定を終える
    notes:
      - 設定は2日あれば完成できる

# ── 導入日(店舗に伺う・約2時間) ────────────────────
install:
  duration: 約2時間
  steps:
    - title: アプリを入れる
      detail: 店舗のiPadに「ポッキリ.Night」のアプリを入れる
    - title: ログイン
      detail: その店舗のIDとパスワードを入力する
      notes:
        - IDとパスワードは、管理者が持っている
    - title: プリンターを接続
      detail: 店舗のプリンターとiPadをつなぐ
    - title: 操作方法の説明
      detail: フロア画面と管理画面の使い方を、動画を使って説明する
      notes:
        - 管理画面で、メニューとキャストの追加を必ず促す
        - キャストの名前だけなら、iPadのタイムカードから登録できる
        - キャストの情報の入力は、管理画面から行う
    - title: 質疑応答
      detail: 店舗からの質問に答える

# ── 当日までのチェック ──────────────────────────
checklist:
  契約時:
    - LINEグループを作り、担当者4名を招待した
    - お客様契約情報を記入してもらった
    - 請求方法と無料期間を確認した
    - 導入日を決めた
  契約後:
    - 契約日にフォームを送った
    - 2日以内にフォームの記入が終わった
    - アカウントを作った
    - 設定を終えた
  導入日:
    - アプリを入れてログインできた
    - プリンターがつながった
    - メニューとキャストの追加を案内した
    - 質問に答えた

# ── 未決事項(この資料で決めきれていないこと) ─────────
open_issues:
  - パスワードの決め方(社内ルール)を別途まとめる。この資料には書かない
  - 導入日より前に、店舗がメニューとキャストを入力できる手順を用意するか
