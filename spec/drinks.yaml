# 商品(お酒)カタログ ─ ポッキリ.Night の「商品を検索して追加」で検索できる銘柄の一覧
#
# これが唯一の正。menu/drinks.json と menu/preview/index.html は
# scripts/build_catalog.py で、このファイルから作り直す(手で直さない)。
#
# ルール
# - 価格は持たない。店舗が追加するときに自分で入力する
# - 夜のお店(BAR・キャバクラ・クラブ・ラウンジ・ホストクラブ・スナック)に
#   置いてある銘柄を、ジャンル(category)ごとに集めた。2026-10-19 に
#   業界コラム・メニュー紹介記事・メーカー情報をもとに整理
# - 検索は 商品名・かな・別名(aliases)・ジャンル名 のどれにでも当たる
# - category の kind(ドリンク/ボトル/フード/その他)・keep(ボトルキープ対象)・
#   cast(キャストドリンクの初期値)は、その中の商品の初期値。商品ごとに上書きできる
# - 1つの銘柄でサイズ違い(ハーフ・マグナム)は、名前に「(1500ml)」のように付ける
# - 写真・絵は持たない。画面には商品名だけを出す(実在ブランドの写真は許諾が要るため)

version: 2026-10-19

kinds: [ドリンク, ボトル, フード, その他]

