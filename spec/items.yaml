  - id: bottle_back_mode
    route: form
    section: S4
    label: ボトルバック(全キャスト)
    type: radio
    unknown_option: true
    options: [店舗一律, キャストごとに違う]
    hint: |-
      ボトルが1本入るごとに、キャストに付くバックです。
      「店舗一律」にすると、全キャストが同じバックになります。
    source: {doc: 追加要望 S4 ボトルバック}
    help:
      - title: "「店舗一律」が合うお店"
        text: |-
          どのキャストでも、ボトルのバックが同じお店です。
          例)ボトル3万円の10%なら、全員3,000円

          次の質問で、金額か%を入力します。
          バックを付けていないお店も、こちらを選び
          次の質問で「0」と入力してください。
      - title: "「キャストごとに違う」が合うお店"
        text: |-
          ランクや人によって、バックが違うお店です。
          例)Aさんは10%、Bさんは500円、新人は0円

          キャストごとの金額は、訪問時に伺い
          POSへ一緒に登録します。

  - id: bottle_back_rate
    route: form
    section: S4
    label: ボトルバックの金額・率(店舗一律)
    type: rate
    units: ["%", 円]
    show_if: {item: bottle_back_mode, equals: 店舗一律}
    hint: 1本あたりの金額か、ボトルの料金の%を入力してください
    source: {doc: 追加要望 S4 ボトルバック}
    help:
      - title: "入力のしかた"
        text: |-
          先に「%」か「円」を選び、数字を入力します。

          例)ボトル料金の10% → 「10」と「%」
          例)1本につき2,000円 → 「2000」と「円」

          バックを付けていない場合は「0」です。

  - id: bottle_back_later
    route: form
    section: S4
    label: ボトルバックは、あとで登録します
    type: note
    show_if: {item: bottle_back_mode, equals: キャストごとに違う}
    body: キャストごとのバックは、訪問時にPOSへ一緒に登録します。
    source: {doc: 追加要望 S4 ボトルバック}

  - id: bottle_back_base
    route: form
    section: S4
    label: ボトルバックの計算のもと
    type: radio
    unknown_option: true
    options: [ボトルの料金, 料金から原価を引いた額]
    hint: |-
      ボトルバックの%を、どの金額にかけるかです
    source: {doc: 2026-09-28 追加要望 ボトルバックは原価を引いた額から}
    help:
      - title: "「ボトルの料金」が合うお店"
        text: |-
          ボトルの料金に、そのまま%をかけるお店です。
          例)ボトル3万円の10%なら、3,000円
      - title: "「料金から原価を引いた額」が合うお店"
        text: |-
          料金から原価を引いた額に、%をかけるお店です。
          例)料金3万円・原価1万円の10%なら、2,000円

          ボトルごとの原価は、商品メニューと一緒に
          送ってください。
      - title: "バックを円で決めているお店"
        text: |-
          1本あたりの金額で決めている場合は、
          どちらを選んでも計算は変わりません。
          例)1本につき2,000円なら、いつも2,000円

  - id: bottle_split
    route: form
    section: S4
    label: ボトルバックの折半
    type: radio
    unknown_option: true
    options: [使わない, 使う]
    hint: |-
      1本のボトルに、複数のキャストが付いたときの扱いです。
      「使う」にすると、バックを均等に分けます。
    source: {doc: ポッキリ.Night のバックルール(担当卓売上・商品・ボトル折半・スライド・本数ボーナス)}
    help:
      - title: "「使う」が合うお店"
        text: |-
          1本のボトルに2人以上が付いたら、
          バックを均等に分けるお店です。
          例)ボトルバック2,000円で2人なら、1人1,000円
      - title: "「使わない」が合うお店"
        text: |-
          ボトルを入れてもらったキャスト1人に、
          バックを全額つけるお店です。
          例)2人付いても、2,000円は入れてもらった1人に

  - id: food_back_use
    route: form
    section: S4
    label: フードバックの有無
    type: radio
    unknown_option: true
    options: [なし, あり]
    hint: フードが入ったとき、キャストにバックを付けるかどうかです
    source: {doc: 2026-09-28 追加要望 有無を選んでから記入}
    help:
      - title: "「あり」が合うお店"
        text: |-
          フードが入ると、キャストにバックが付くお店です。
          例)フード1品につき、100円のバック
      - title: "「なし」が合うお店"
        text: |-
          フードにバックを付けていないお店です。
          例)フードがない、またはバックは付けない

  - id: food_back_mode
    route: form
    section: S4
    label: フードバック(全キャスト)
    type: radio
    unknown_option: true
    show_if: {item: food_back_use, equals: あり}
    options: [店舗一律, キャストごとに違う]
    hint: |-
      フードが1品入るごとに、キャストに付くバックです。
      「店舗一律」にすると、全キャストが同じバックになります。
    source: {doc: ポッキリ.Night のバックルール(担当卓売上・商品・ボトル折半・スライド・本数ボーナス)}
    help:
      - title: "「店舗一律」が合うお店"
        text: |-
          どのキャストでも、フードのバックが同じお店です。
          例)フード1,500円の10%なら、全員150円

          次の質問で、金額か%を入力します。
      - title: "「キャストごとに違う」が合うお店"
        text: |-
          ランクや人によって、バックが違うお店です。
          例)Aさんは10%、Bさんは500円、新人は0円

          キャストごとの金額は、訪問時に伺い
          POSへ一緒に登録します。

  - id: food_back_rate
    route: form
    section: S4
    label: フードバックの金額・率(店舗一律)
    type: rate
    units: ["%", 円]
    show_if: {item: food_back_mode, equals: 店舗一律}
    hint: 1品あたりの金額か、フードの料金の%を入力してください
    source: {doc: ポッキリ.Night のバックルール(担当卓売上・商品・ボトル折半・スライド・本数ボーナス)}
    help:
      - title: "入力のしかた"
        text: |-
          先に「%」か「円」を選び、数字を入力します。

          例)フード料金の10% → 「10」と「%」
          例)1品につき100円 → 「100」と「円」

          バックを付けていない場合は「0」です。

  - id: food_back_later
    route: form
    section: S4
    label: フードバックは、あとで登録します
    type: note
    show_if: {item: food_back_mode, equals: キャストごとに違う}
    body: キャストごとのバックは、訪問時にPOSへ一緒に登録します。
    source: {doc: ポッキリ.Night のバックルール(担当卓売上・商品・ボトル折半・スライド・本数ボーナス)}

  - id: other_backs
    route: form
    section: S4
    label: そのほかのバック
    type: checkbox
    unknown_option: true
    options: [スライド(実績に応じて率が上がる), 本数ボーナス(指名本数に応じたボーナス), 特になし]
    hint: |-
      使っているものに、すべてチェックしてください。
      細かい条件は、訪問時に伺います。
    source: {doc: ポッキリ.Night のバックルール(担当卓売上・商品・ボトル折半・スライド・本数ボーナス)}
    help:
      - title: "それぞれの意味"
        text: |-
          スライド:実績が増えるほど、
          バックの率が上がる仕組みです。
          例)売上50万円までは10%、超えたら15%

          本数ボーナス:指名の本数に応じて、
          ボーナスが付く仕組みです。
          例)月に指名20本で10,000円

          どちらも使っていないお店は「特になし」です。

  - id: back_rounding
    route: form
    section: S4
    label: バック端数
    type: radio
    unknown_option: true
    options: [使わない, 使う]
    hint: バックの金額の端数を、きりのいい金額にそろえるかどうかです
    source: {sample: nomination, question: バック端数の丸め単位}
    help:
      - title: "「使う」が合うお店"
        text: |-
          バックの端数を、きりのいい金額にするお店です。
          例)100円単位なら、バック1,234円 → 1,200円
      - title: "「使わない」が合うお店"
        text: |-
          計算した金額を、1円単位でそのまま払うお店です。
          例)バック1,234円は、そのまま1,234円

  - id: back_rounding_unit
    route: form
    section: S4
    label: バック端数(単位)
    type: radio
    unknown_option: true
    options: [10円, 100円, 記入]
    other: {type: number, unit: 円, min: 1, max: 10000}
    show_if: {item: back_rounding, equals: 使う}
    source: {sample: nomination, question: バック端数の丸め単位}
    hint: |-
      バックの端数を、何円単位でそろえるかです
    help:
      - title: "選び方"
        text: |-
          例)10円単位なら、1,234円 → 1,230円
          例)100円単位なら、1,234円 → 1,200円

          一覧にない単位(50円など)は「記入」を選び、
          横の欄に数字を入力します。

  - id: back_rules
    route: onsite
    chapter: 5
    label: バックルール(10パターン)・ボトル折半
    type: table
    columns: [ルール名, 対象の指名区分, 決め方, 金額 / 率]
    onsite_note: 10パターンから店舗のルールを選び、その場で設定する
    source: {sample: nomination, question: バックルール}

  - id: back_rule_examples
    route: onsite
    chapter: 5
    label: 指名バックの決め方(記入例)
    type: table
    columns: [ルール名, 対象の指名区分, 決め方, 金額 / 率]
    onsite_note: バックルール設定時の例として使う
    source: {sample: nomination, question: （記入例）指名バックの決め方}

  # ── 既存見本 ④ 税・インボイス ─────────────────────────────

  - id: invoice_registered
    route: form
    section: S5
    label: インボイス登録
    type: radio
    unknown_option: true
    options: [登録している, 登録していない]
    source: {sample: tax, question: 適格請求書 登録番号}
    hint: |-
      インボイス(適格請求書)の登録をしているかどうかです
    help:
      - title: "「登録している」が合うお店"
        text: |-
          「T」から始まる13桁の番号を持っているお店です。
          例)T1234567890123

          次の質問で番号を入力します。
      - title: "「登録していない」が合うお店"
        text: |-
          登録番号を持っていないお店です。

          わからない場合は、顧問の税理士さんや
          会計担当の方に確認してください。

  - id: invoice_number
    route: form
    section: S5
    label: インボイス登録番号
    type: short
    placeholder: 例:T1234567890123
    validation: {kind: regex, pattern: '^T\d{13}$', message: 「T」から始まる14文字で入力してください(例:T1234567890123)}
    show_if: {item: invoice_registered, equals: 登録している}
    source: {sample: tax, question: 適格請求書 登録番号}
    hint: |-
      「T」と13桁の数字を入力してください
    help:
      - title: "確認のしかた"
        text: |-
          税務署から届いた登録通知書に書いてあります。
          例)T1234567890123

          国税庁のインボイス公表サイトで、
          店名や会社名からも調べられます。

  - id: tax_rate_standard
    route: fixed
    label: 標準税率
    type: number
    unit: "%"
    default: 10
    source: {sample: tax, question: 税率}

  - id: tax_rate_reduced
    route: fixed
    label: 軽減税率
    type: number
    unit: "%"
    default: 8
    source: {sample: tax, question: 税率}

  - id: price_display
    route: form
    section: S5
    label: 価格の表示方法
    type: radio
    unknown_option: true
    options: [内税(税込表示), 外税(税抜表示)]
    source: {sample: tax, question: 表示価格}

  # ── 既存見本 ⑤ 決済方法 ─────────────────────────────────
    hint: |-
      メニューの金額が、税込みか税抜きかです
    help:
      - title: "「内税(税込表示)」が合うお店"
        text: |-
          メニューの金額に、税が入っているお店です。
          例)メニュー8,000円 → 会計も8,000円
      - title: "「外税(税抜表示)」が合うお店"
        text: |-
          メニューの金額に、税を足して会計するお店です。
          例)メニュー8,000円 → 会計は8,800円

  - id: cash_surcharge
    route: fixed
    label: 現金の上乗せ手数料
    type: number
    unit: "%"
    default: 0
    source: {sample: payments, question: 決済方法ごとの上乗せ手数料}

  - id: card_surcharge
    route: form
    section: S6
    label: カード払いの上乗せ手数料
    type: radio
    unknown_option: true
    options: [なし, あり]
    other: {type: number, unit: "%", min: 0, max: 100}
    hint: カード会社の規約で、手数料の上乗せが禁止されている場合があります
    source: {sample: payments, question: 決済方法ごとの上乗せ手数料}
    help:
      - title: "「あり」が合うお店"
        text: |-
          カード払いのとき、会計に手数料を足すお店です。
          例)会計10,000円・上乗せ10%なら、11,000円

          「あり」の横の欄に、率を入力します。
      - title: "「なし」が合うお店"
        text: |-
          カード払いでも、現金と同じ金額のお店です。
          例)会計10,000円は、カードでも10,000円

  - id: credit_surcharge
    route: form
    section: S6
    label: 売掛の上乗せ手数料
    type: radio
    unknown_option: true
    options: [なし, あり]
    other: {type: number, unit: "%", min: 0, max: 100}
    source: {sample: payments, question: 決済方法ごとの上乗せ手数料}
    hint: |-
      売掛(ツケ)で会計するとき、手数料を足すかどうかです
    help:
      - title: "「あり」が合うお店"
        text: |-
          売掛のとき、会計に手数料を足すお店です。
          例)会計50,000円・上乗せ10%なら、55,000円

          「あり」の横の欄に、率を入力します。
      - title: "「なし」が合うお店"
        text: |-
          売掛でも、現金と同じ金額のお店です。
          例)売掛をしていないお店も「なし」です

  - id: card_fee_use
    route: form
    section: S6
    label: カード決済手数料(店舗負担)の有無
    type: radio
    unknown_option: true
    options: [なし, あり]
    hint: カード会社に払う決済手数料を、POSで計算するかどうかです
    source: {doc: 2026-09-28 追加要望 カード決済手数料の有無}
    help:
      - title: "「あり」が合うお店"
        text: |-
          カード払いを使っていて、カード会社に
          決済手数料を払っているお店です。
          例)売上の3.24%を、カード会社に払っている

          次の質問で、手数料の率を入力します。
      - title: "「なし」が合うお店"
        text: |-
          カード払いを使っていないお店です。
          例)会計は、現金と売掛だけ

  - id: card_fee
    route: form
    section: S6
    label: カード決済手数料(店舗負担)
    type: number
    unit: "%"
    hint: 内税(税込表示)のときだけ、自動で適用されます
    show_if: {item: card_fee_use, equals: あり}
    validation: {kind: number, min: 0, max: 100, message: 0〜100の数字で入力してください}
    source: {sample: payments, question: カード決済手数料（店舗共通）}

