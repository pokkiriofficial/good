  # ── 既存見本 ⑦ 卓とフロアマップ ───────────────────────────

  - id: room_charge_use
    route: form
    section: S11
    label: 個室料の有無
    type: radio
    unknown_option: true
    options: [なし, あり]
    hint: |-
      個室を使った卓だけにかかる料金があるかどうかです。
      ハウスチャージとは別のものです
    source: {doc: 2026-09-30 追加要望 個室料}
    help:
      - title: "「あり」が合うお店"
        text: |-
          個室を使うと、料金が上がるお店です。
          例)個室を使った卓は、5,000円を追加

          「あり」にすると、下の卓の一覧に
          「個室料」の列が出ます。
      - title: "「なし」が合うお店"
        text: |-
          個室がない、または料金が同じお店です。
          例)どの卓でも、セット料金だけ

  - id: tables
    route: form
    section: S11
    label: 卓の一覧
    type: table
    columns: [卓名, 席数, 個室料(円)]
    cells: [text, int, int]
    column_show_if: {"2": {item: room_charge_use, equals: あり}}
    optional_columns: [2]
    examples:
      - [VIP1, 6, 5000]
      - [カウンター, 8, ""]
    hint: |-
      お店にある卓を、1行に1つ書いてください。
      配置は、訪問時にPOSの画面で一緒に決めます。
    source: {sample: tables, question: 卓の一覧}
    help:
      - title: "書き方"
        text: |-
          卓名は、お店で呼んでいる名前で大丈夫です。
          席数は、座れるお客様の人数の目安です。

          例)A卓/4
          例)VIP1/6
          例)カウンター1/1

          卓の数だけ、「行を追加」で行を増やします。
      - title: "個室料"
        text: |-
          個室料の有無で「あり」を選ぶと、列が出ます。
          個室を使った卓の会計に、1回だけ付く料金です。
          例)VIP1を使った卓は、5,000円を追加

          個室料がかからない卓は、空欄で大丈夫です。

  - id: floor_map
    route: onsite
    chapter: 2
    label: フロアマップの配置
    type: note
    onsite_note: フロアマップ上で卓をドラッグして配置する
    source: {sample: tables, question: フロアマップ上の配置（どの位置に置くか）は、導入日にPOS画面上でドラッグして決めます。ここでは卓の名前と数だけ伺います。}

  # ── 既存見本 ⑧ 流入経路 ─────────────────────────────────

  - id: referral_tags
    route: form
    section: S9
    label: お客様の流入経路
    type: checkbox
    unknown_option: true
    options: [新規, リピーター, 紹介, SNS, ビラ, 看板]
    other: {type: short}
    hint: |-
      お客様がどこから来たかを記録する項目です。
      金額の計算には影響しません。あとから追加できます
    source: {sample: referral, question: 集計タグ}

    help:
      - title: "使い方"
        text: |-
          お客様がどこから来たか(流入経路)を、
          会計のときに選んで記録するための項目です。

          例)SNSを見て来た → 「SNS」
          例)常連さんの紹介 → 「紹介」
          例)お店の前を通って → 「看板」

          集計に使いたいものに、すべてチェックします。

  - id: bottle_keep_period
    route: form
    section: S9
    label: ボトルキープの期限
    type: dropdown
    unknown_option: true
    options: [ボトルキープなし, 期限なし, 1か月, 2か月, 3か月, 6か月, 1年]
    hint: |-
      キープしたボトルを、いつまで預かるかです
    source: {doc: 2026-09-30 追加要望 ボトルキープの期限}
    help:
      - title: "選び方"
        text: |-
          最後に来店した日から数えた期限です。
          例)「3か月」なら、3か月来店がないと期限切れ

          期限を決めていないお店は「期限なし」です。
          キープをしていないお店は「ボトルキープなし」です。

  - id: bottle_keep_alert
    route: form
    section: S9
    label: ボトルキープの期限のお知らせ
    type: dropdown
    unknown_option: true
    options: [お知らせしない, 3日前, 7日前, 14日前, 30日前]
    show_if: {item: bottle_keep_period, in: [1か月, 2か月, 3か月, 6か月, 1年]}
    hint: |-
      期限が近づいたとき、何日前に知らせるかです
    source: {doc: 2026-09-30 追加要望 ボトルキープの期限のお知らせ}
    help:
      - title: "選び方"
        text: |-
          期限が近いボトルを、管理画面の顧客管理で
          お知らせします。
          例)「7日前」なら、期限の7日前から表示

          お客様への連絡のきっかけに使えます。
          お知らせが要らないお店は「お知らせしない」です。

  # ── 既存見本 ⑪ プリンター・領収書 ─────────────────────────
  - id: receipt_printer
    route: form
    section: S8
    label: |-
      レシートプリンター
      (EPSON/TM-m30Ⅲ-H・Star/MCP31LB)
    type: radio
    unknown_option: true
    options: [ある, これから用意, 使わない]
    skip_to_on: {使わない: S9}
    source: {doc: 3章 S8}
    hint: |-
      POSにつなぐ、レシートプリンターがあるかどうかです
    help:
      - title: "「ある」が合うお店"
        text: |-
          タイトルの機種の、どちらかを持っているお店です。
      - title: "「これから用意」が合うお店"
        text: |-
          これから購入するお店です。
          訪問日までに届いていれば、当日に設定できます。
      - title: "「使わない」が合うお店"
        text: |-
          レシートや領収書を、POSから印刷しないお店です。
          例)領収書は手書きで渡している

  - id: printer_device
    route: form
    section: S8
    label: プリンターの機器名
    type: short
    placeholder: 例:TM-m30Ⅲ-H
    show_if: {item: receipt_printer, equals: ある}
    source: {sample: printer, question: プリンター本体}
    hint: |-
      お持ちのレシートプリンターの、機種名を書いてください
    help:
      - title: "機器名の見つけ方"
        text: |-
          プリンター本体の、上か前に書いてあります。
          見つからないときは、底のシールを見てください。

          例)EPSON TM-m30Ⅲ-H
          例)Star MCP31LB

          わからない場合は「わからない」で大丈夫です。

  - id: paper_width
    route: form
    section: S8
    label: 用紙幅
    type: radio
    unknown_option: true
    options: [58mm, 80mm]
    source: {sample: printer, question: 使用する用紙幅}
    hint: |-
      レシートプリンターで使う、用紙の幅です
    help:
      - title: "選び方"
        text: |-
          58mm:幅の細い用紙です
          例)タクシーや小さなお店のレシート

          80mm:幅の広い用紙です
          例)コンビニやスーパーのレシート

          用紙の箱や、ロールの芯に書いてあります。
          これから用意する場合は、80mmがおすすめです。

  - id: receipt_design
    route: form
    section: S8
    label: 領収書のデザイン
    type: radio
    unknown_option: false   # 見本から必ず1つ選んでもらうため「未定」は付けない
    options: ["1", "2", "3"]
    hint: 下の見本から、刷りたいデザインの番号を選んでください
    # 各選択肢の見本画像。ポッキリ.Night の領収書プレビュー(nightwork-pos.vercel.app/api/receipt/preview)の
    # classic-frame・seigaiha-frame・kikka-frame をそのまま保存したもの。ファイルが無い番号は「見本画像を準備中」
    option_images: [form/images/receipt-1.svg, form/images/receipt-2.svg, form/images/receipt-3.svg]
    source: {sample: printer, question: 領収書のデザイン}
    help:
      - title: "選び方"
        text: |-
          下の見本を見比べて、お店に合う番号を選びます。
          例)シンプルな形がよい、店名を大きくしたい

          あとから変えたい場合は、訪問時に相談できます。

  - id: receipt_serial
    route: form
    section: S8
    label: 領収書の通し番号の有無
    type: radio
    unknown_option: true
    options: [なし, あり]
    source: {doc: 2026-10-02 追加要望 領収書の通し番号}
    hint: |-
      領収書に、1枚ごとに増える番号を刷るかどうかです
    help:
      - title: "「あり」が合うお店"
        text: |-
          発行した領収書を、番号で控えておきたいお店です。
          例)No.000123 のように、右上に番号が入る
      - title: "「なし」が合うお店"
        text: |-
          領収書に番号がなくても困らないお店です。
          あとから管理画面で変えられます。

  - id: kitchen_slip
    route: form
    section: S8
    label: キッチン伝票
    type: radio
    unknown_option: true
    options: [使わない, 使う]
    source: {sample: printer, question: キッチン伝票に印刷するカテゴリ}
    hint: |-
      注文が入ったとき、キッチン用の伝票を印刷するかどうかです
    help:
      - title: "「使う」が合うお店"
        text: |-
          キッチンやバーで、注文を紙で確認するお店です。
          例)フードの注文が入ると、厨房で伝票が出る
      - title: "「使わない」が合うお店"
        text: |-
          注文を、口頭や画面で確認するお店です。
          例)ボーイがドリンクを作って運んでいる

  - id: kitchen_categories
    route: form
    section: S8
    label: キッチン伝票に印刷するカテゴリ
    type: checkbox
    unknown_option: true
    options: [ドリンク, ボトル, フード, その他]
    show_if: {item: kitchen_slip, equals: 使う}
    source: {sample: printer, question: キッチン伝票に印刷するカテゴリ}

  # ── 既存見本 ⑫ メンバー台帳 ─────────────────────────────
    hint: |-
      キッチン伝票を印刷する、商品の種類です
    help:
      - title: "選び方"
        text: |-
          例)フードだけ厨房で作る → 「フード」だけ
          例)ドリンクもバーで作る → 「ドリンク」も

          印刷したい種類に、すべてチェックします。

  - id: cast_roster
    route: template
    theme: 5
    label: キャスト
    type: table
    columns: [源氏名, 読み仮名, ランク(あれば), 区分, 入店日(あれば)]
    cells: [text, text, text, [在籍, 体験入店, 派遣, 日払い], text]
    examples:
      - [ココ, ここ, レギュラー, 在籍, "2026-04-01"]
      - [りん, りん, なし, 体験入店, "2026-10-01"]
    line: {format: [源氏名, 読み仮名, ランク(あれば), 区分, 入店日(あれば)], examples: [[ココ, ここ, レギュラー, 在籍, "2026-04-01"], [りん, りん, なし, 体験入店, "2026-10-01"]]}
    source: {sample: roster, question: キャスト}

  - id: staff_roster
    route: template
    theme: 5
    label: スタッフ
    type: table
    columns: [名前, 読み仮名, 職種, 入店日(あれば)]
    cells: [text, text, [ボーイ, キッチン, 店長, その他], text]
    examples:
      - [山田, やまだ, ボーイ, "2026-04-01"]
      - [田中, たなか, キッチン, "2026-06-15"]
    line: {format: [名前, 読み仮名, 職種, 入店日(あれば)], examples: [[山田, やまだ, ボーイ, "2026-04-01"], [田中, たなか, キッチン, "2026-06-15"]]}
    source: {sample: roster, question: スタッフ}

  # 個人別のバック率。POSのメンバー台帳「バック(個人ごと)」に入れる。LINEで先に送る店舗は、テーマ7を使う
  - id: cast_back_table
    route: template
    theme: 7
    label: キャストごとのバック
    type: table
    columns: [源氏名, バックの種類, 額または率]
    cells: [text, [セット, 延長, 指名, 担当卓の売上, ドリンク, ボトル, フード], text]
    examples:
      - [ココ, 指名, 1000円]
      - [ココ, ドリンク, 20%]
    line: {format: [源氏名, バックの種類, 額または率], examples: [[ココ, 指名, 1000円], [ココ, ドリンク, 20%]]}
    source: {doc: "6章(個人別のバック率)"}

  - id: member_pay
    route: onsite
    chapter: 11
    label: 時給・ランク(キャスト・スタッフごと)
    type: note
    onsite_note: 店舗がPOSへ直接入力する(最初の1〜2人は一緒に)
    source: {sample: roster, question: キャスト}

  - id: member_personal_info
    route: onsite
    chapter: 11
    label: 個人情報(本名・生年月日・電話・住所・口座・緊急連絡先・身分証)
    type: note
    onsite_note: キャスト本人が端末で入力し、身分証を提示する
    source: {sample: roster, question: 個人情報（本名・生年月日・電話・住所・給与振込口座・緊急連絡先・身分証明書の提出状況）は、すべて任意項目です。オーナー・店長だけが見られる欄に、あとからメンバーごとに個別入力します。}

  - id: member_back
    route: onsite
    chapter: 11
    label: バック率(キャストごと)
    type: note
    onsite_note: アンケートで「キャストごとに違う」とした種類を、店舗がPOSへ直接入力する。LINEで先に受け取った場合も、入力は店舗が行う
    source: {doc: "6章(個人別のバック率)"}

  - id: member_withholding
    route: onsite
    chapter: 11
    label: 源泉区分(キャストごと)
    type: note
    onsite_note: 店舗がPOSへ直接入力する
    source: {sample: roster, question: （キャストごとに）源泉区分}

  - id: member_commute
    route: onsite
    chapter: 11
    label: 交通費(キャストごとの最寄り駅・送りエリア)
    type: note
    onsite_note: 店舗がPOSへ直接入力する
    source: {sample: roster, question: （キャストごとに）交通費}

  # ── 既存見本 ⑬ 給与運用設定 ─────────────────────────────

  - id: closing_day
    route: form
    section: S10
    label: 締め日
    type: dropdown
    unknown_option: true
    options: [5日, 10日, 15日, 20日, 25日, 末日]
    source: {sample: payroll, question: 締め日 ／ 支払日}
    hint: |-
      給与を計算する期間の、最後の日です
    help:
      - title: "選び方"
        text: |-
          例)「末日」なら、1日〜月末の勤務を計算します。
          例)「15日」なら、前月16日〜15日の勤務です。

          月2回締めている場合は、訪問時に伺います。

  - id: pay_day
    route: form
    section: S10
    label: 支払日
    type: dropdown
    unknown_option: true
    options: [5日, 10日, 15日, 20日, 25日, 末日]
    source: {sample: payroll, question: 締め日 ／ 支払日}
    hint: |-
      給与を支払う日です
    help:
      - title: "選び方"
        text: |-
          例)末日締め・翌月10日払い → 「10日」
          例)15日締め・当月25日払い → 「25日」

  - id: work_time_rounding_unit
    route: form
    section: S10
    label: 勤務時間(単位)
    type: dropdown
    unknown_option: true
    options: [1分, 5分, 10分, 15分, 30分]
    source: {sample: payroll, question: 時給の丸め}
    hint: |-
      勤務時間を、何分単位で数えるかです
    help:
      - title: "選び方"
        text: |-
          1時間50分働いたときの例です(切り捨て)。

          1分 → 1時間50分
          15分 → 1時間45分
          30分 → 1時間30分

          1分単位なら、働いた時間のまま計算します。

  - id: work_time_rounding_mode
    route: form
    section: S10
    label: 勤務時間(方法)
    type: dropdown
    unknown_option: true
    options: [切り捨て, 切り上げ]
    source: {sample: payroll, question: 時給の丸め}
    hint: |-
      端数の時間を、切り捨てるか切り上げるかです
    help:
      - title: "「切り捨て」が合うお店"
        text: |-
          端数の時間は、給与に入れないお店です。
          例)15分単位で1時間50分 → 1時間45分
      - title: "「切り上げ」が合うお店"
        text: |-
          端数の時間も、次の単位まで入れるお店です。
          例)15分単位で1時間50分 → 2時間

  - id: main_withholding_type
    route: form
    section: S10
    label: 主に使う源泉区分
    type: radio
    unknown_option: true
    options: ["報酬源泉(10.21%)", "ホステス源泉(日額5,000円控除)", 給与源泉]
    hint: 率は初期値で設定します。キャストごとの区分は訪問時に入力します
    source: {sample: payroll, question: 源泉率}
    help:
      - title: "それぞれの意味"
        text: |-
          報酬源泉:支払額に10.21%をかけて差し引きます
          例)報酬10万円 → 10,210円を差し引く

          ホステス源泉:1日5,000円を引いてから、
          10.21%をかけて差し引きます
          例)報酬10万円・出勤10日 → 5,105円

          給与源泉:給与として、税額表で計算します

          わからない場合は、税理士さんに確認してください。

  - id: withholding_rates
    route: fixed
    label: 源泉率
    type: table
    columns: [区分, 率 / 控除額]
    default:
      - [報酬源泉, 10.21%]
      - [ホステス源泉, "10.21%(日額5,000円控除)"]
      - [給与源泉, 0%]
    source: {sample: payroll, question: 源泉率}

  - id: commute_use
    route: form
    section: S10
    label: 交通費の支給
    type: radio
    unknown_option: true
    options: [なし, あり]
    hint: キャスト・スタッフに交通費を出しているかどうかです
    source: {doc: 2026-09-28 追加要望 有無を選んでから記入}
    help:
      - title: "「あり」が合うお店"
        text: |-
          勤務した日に、交通費を出しているお店です。
          例)3時間以上働いた日は、交通費を出す

          「あり」にすると、対象になる勤務時間の
          質問が出ます。1人ずつの金額は訪問時に伺います。
      - title: "「なし」が合うお店"
        text: |-
          交通費を出していないお店です。
          例)交通費は、給与に含めている

  - id: commute_min_hours
    route: form
    section: S10
    label: 交通費の対象になる最低勤務時間
    type: number
    show_if: {item: commute_use, equals: あり}
    unit: 時間
    validation: {kind: number, min: 0, max: 24, message: 0〜24の数字で入力してください}
    source: {sample: payroll, question: 交通費の対象条件}
    hint: |-
      交通費を出す、最低の勤務時間です
    help:
      - title: "入力のしかた"
        text: |-
          例)「3」なら、3時間以上働いた日だけ出ます。
          例)「4」なら、4時間以上働いた日だけ出ます。

          時間の条件がない場合は「0」です。

  - id: commute_full_day_hours
    route: form
    section: S10
    label: フル日とみなす勤務時間
    type: number
    show_if: {item: commute_use, equals: あり}
    unit: 時間
    validation: {kind: number, min: 0, max: 24, message: 0〜24の数字で入力してください}
    source: {sample: payroll, question: 交通費の対象条件}
    hint: |-
      何時間働いたら、1日フルの勤務とみなすかです
    help:
      - title: "入力のしかた"
        text: |-
          例)「5」なら、5時間以上をフル日と数えます。
          例)「6」なら、6時間以上をフル日と数えます。

          交通費や手当を、フル日の数で決めるときに
          使います。

  - id: late_deduction
    route: form
    section: S10
    label: 遅刻控除
    type: radio
    unknown_option: true
    options: [使わない, 使う]
    source: {sample: payroll, question: 遅刻控除を使うか}
    hint: |-
      遅刻したとき、給与から差し引くかどうかです
    help:
      - title: "「使う」が合うお店"
        text: |-
          遅刻した分を、給与から差し引くお店です。
          例)15分ごとに500円なら、30分遅刻で1,000円
      - title: "「使わない」が合うお店"
        text: |-
          遅刻しても、給与から差し引かないお店です。
          例)遅刻は注意だけで、金額は変えない

  - id: late_deduction_unit
    route: form
    section: S10
    label: 遅刻控除の時間の区切り
    type: dial
    unknown_option: true
    options: [1分, 5分, 10分, 15分, 30分, 60分]
    show_if: {item: late_deduction, equals: 使う}
    source: {sample: payroll, question: 遅刻控除の内容}
    hint: |-
      何分ごとに差し引くかです。
      ダイヤルを回して選んでください
    help:
      - title: "選び方"
        text: |-
          遅刻した時間を、この区切りで数えます。
          例)「15分」なら、15分ごとに次の金額を差し引く
          → 15分遅刻で1回分、30分遅刻で2回分

          1分ごとより、15分や30分ごとのほうが
          計算がかんたんです。

  - id: late_deduction_amount
    route: form
    section: S10
    label: 遅刻控除の金額(区切りごと)
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: late_deduction, equals: 使う}
    source: {sample: payroll, question: 遅刻控除の内容}
    hint: |-
      上で選んだ時間ごとに、差し引く金額です
    help:
      - title: "入力のしかた"
        text: |-
          例)15分ごとに500円なら「500」
          → 15分遅刻で500円、30分遅刻で1,000円

          カンマは付けずに、数字だけ入力してください。

  - id: late_penalty_points
    route: onsite
    chapter: 12
    label: 遅刻の減点(1分あたり・pt)
    type: note
    onsite_note: 3章のフォームでは聞かない。ポイント時給を使う店舗だけ、訪問時に設定する
    source: {sample: payroll, question: 遅刻控除の内容}

  - id: late_grace_minutes
    route: form
    section: S10
    label: 遅刻の猶予
    type: dial
    unknown_option: true
    options: [なし, 5分, 10分, 15分, 30分]
    show_if: {item: late_deduction, equals: 使う}
    source: {sample: payroll, question: 遅刻の猶予・上限}
    hint: |-
      この分数までの遅刻は、差し引かない猶予です
    help:
      - title: "入力のしかた"
        text: |-
          例)「5分」なら、5分までの遅刻は差し引きません。
          例)「なし」なら、1分の遅刻から差し引きます。

          ダイヤルを回して選んでください。

  - id: late_daily_cap
    route: form
    section: S10
    label: 遅刻控除の1日の上限
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    show_if: {item: late_deduction, equals: 使う}
    source: {sample: payroll, question: 遅刻の猶予・上限}
    hint: |-
      1日に差し引く金額の上限です。
      上限がない場合は「0」を入力してください
    help:
      - title: "入力のしかた"
        text: |-
          例)「3000」なら、何分遅れても1日3,000円まで
          例)「0」なら、上限なし(遅れた分だけ差し引く)

  - id: daily_advance_cap
    route: form
    section: S10
    label: 日払いの上限
    type: number
    unit: 円
    validation: {kind: integer, min: 0, message: 数字のみで入力してください(カンマ不要)}
    source: {sample: payroll, question: 日払いの上限}
    hint: |-
      1日に日払いできる金額の上限です。
      上限がない場合は「0」を入力してください
    help:
      - title: "入力のしかた"
        text: |-
          日払い:その日の給与の一部を、当日に渡すことです。

          例)「10000」なら、1日10,000円まで
          例)「0」なら、上限なし

  - id: pay_ratio_alert_use
    route: form
    section: S10
    label: 給率の警告
    type: radio
    unknown_option: true
    options: [なし, あり]
    hint: バック率が高すぎるとき、画面でお知らせするかどうかです
    source: {doc: 2026-09-28 追加要望 有無を選んでから記入}
    help:
      - title: "「あり」が合うお店"
        text: |-
          バック率が高くなりすぎたら、知りたいお店です。
          例)売上に対してバックが50%を超えたら知らせる

          「あり」にすると、しきい値の質問が出ます。
      - title: "「なし」が合うお店"
        text: |-
          お知らせが要らないお店です。
          例)バック率は、自分で確認している

  - id: pay_ratio_alert
    route: form
    section: S10
    label: 給率の警告しきい値
    type: number
    show_if: {item: pay_ratio_alert_use, equals: あり}
    unit: "%"
    hint: 担当売上に対するバック率がこれを超えたら、画面でお知らせします
    validation: {kind: number, min: 0, max: 100, message: 0〜100の数字で入力してください}
    source: {sample: payroll, question: 給率の警告しきい値}
    help:
      - title: "入力のしかた"
        text: |-
          給率:担当売上に対する、バックの割合です。

          例)「50」なら、売上10万円に対して
          バックが5万円を超えたときにお知らせします。

  - id: send_areas_use
    route: form
    section: S10
    label: 送り代
    type: radio
    unknown_option: true
    options: [なし, あり]
    hint: キャストの送りで、送り代を差し引いている場合は「あり」です
    source: {doc: 2026-09-25 記入テンプレートからアンケートへ移動}
    help:
      - title: "「あり」が合うお店"
        text: |-
          キャストの送りで、送り代を
          給与から差し引いているお店です。
          例)ココさんは500円、りんさんは1,000円

          「あり」にすると、キャストごとに書く
          表が出ます。
      - title: "「なし」が合うお店"
        text: |-
          送り代を取っていないお店です。
          例)送りがない、または送りは無料

  - id: send_areas
    route: form
    section: S10
    label: キャストごとの送り代
    type: table
    columns: [源氏名, 送り先のエリア, 送り代(円)]
    cells: [text, text, int]
    examples:
      - [ココ, みなとみらい, 1500]
      - [りん, 関内, 1000]
    show_if: {item: send_areas_use, equals: あり}
    source: {sample: payroll, question: 送りエリア別の金額}
    hint: |-
      送りを使うキャストを、1行に1人ずつ書いてください
    help:
      - title: "書き方"
        text: |-
          送り代は、キャストの給与から差し引く金額です。
          源氏名と、送り先のエリア、金額を書きます。

          例)ココ/みなとみらい/1500
          例)りん/関内/1000
          例)ゆな/埼玉方面/2000

          住所などの個人情報は書かないでください。

  - id: busy_hours_use
    route: form
    section: S10
    label: 時給を上げる時間帯
    type: radio
    unknown_option: true
    options: [なし, あり]
    hint: 忙しい時間帯だけ、時給を上げている場合は「あり」です
    source: {doc: 2026-09-25 記入テンプレートからアンケートへ移動}
    help:
      - title: "「あり」が合うお店"
        text: |-
          忙しい時間帯だけ、時給を上げているお店です。
          例)22時〜24時は、時給を1.2倍にする
      - title: "「なし」が合うお店"
        text: |-
          時間帯で、時給を変えないお店です。
          例)何時に働いても、時給は同じ

  - id: busy_hours
    route: form
    section: S10
    label: 時給を上げる時間帯と、上げ方
    type: table
    columns: [開始, 終了, 倍率または加算額]
    cells: [time, time, text]
    examples:
      - ["22:00", "24:00", 1.2倍]
    hint: 例:22時〜24時は時給を1.2倍、または+300円
    show_if: {item: busy_hours_use, equals: あり}
    source: {sample: payroll, question: 繁忙時間帯の時給（期間限定）}
    help:
      - title: "書き方"
        text: |-
          開始と終了の時刻を選び、上げ方を書きます。

          例)22:00/24:00/1.2倍
          例)0:00/2:00/+300円
