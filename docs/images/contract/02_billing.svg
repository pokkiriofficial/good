<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" role="img" aria-label="請求の例(10月に導入した場合)"><title>請求の例(10月に導入した場合)</title><rect width="1200" height="440" fill="#f3f6fb" rx="16"/><rect x="470" y="70" width="220" height="330" rx="12" fill="#e6f4ea"/><text x="580.0" y="100" font-size="18" font-weight="700" fill="#2e7d5b" text-anchor="middle">この月の月額は無料</text><text x="580.0" y="124" font-size="18" font-weight="400" fill="#2e7d5b" text-anchor="middle">(実質1か月無料)</text><line x1="250" y1="150" x2="250" y2="390" stroke="#cfd8e6" stroke-width="2"/><text x="360.0" y="178" font-size="20" font-weight="700" fill="#1c2433" text-anchor="middle">10月(導入月)</text><line x1="470" y1="150" x2="470" y2="390" stroke="#cfd8e6" stroke-width="2"/><text x="580.0" y="178" font-size="24" font-weight="700" fill="#1c2433" text-anchor="middle">11月</text><line x1="690" y1="150" x2="690" y2="390" stroke="#cfd8e6" stroke-width="2"/><text x="800.0" y="178" font-size="24" font-weight="700" fill="#1c2433" text-anchor="middle">12月</text><line x1="910" y1="150" x2="910" y2="390" stroke="#cfd8e6" stroke-width="2"/><text x="1020.0" y="178" font-size="24" font-weight="700" fill="#1c2433" text-anchor="middle">1月</text><text x="300" y="60" font-size="16" font-weight="400" fill="#5b6678" text-anchor="start">▼ 導入日(月初でも月末でも同じ)</text><line x1="300" y1="70" x2="300" y2="390" stroke="#2e7d5b" stroke-width="2" stroke-dasharray="6 6"/><text x="30" y="224.0" font-size="20" font-weight="400" fill="#1c2433" text-anchor="start">新規</text><text x="30" y="254.0" font-size="20" font-weight="400" fill="#1c2433" text-anchor="start">(初期費用あり)</text><line x1="250" y1="230" x2="910" y2="230" stroke="#5b6678" stroke-width="2"/><circle cx="470" cy="230" r="11" fill="#1f3a6b"/><text x="470" y="210" font-size="16" font-weight="700" fill="#1f3a6b" text-anchor="middle">10月末</text><text x="470" y="262.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="middle">初期費用</text><circle cx="690" cy="230" r="11" fill="#1f3a6b"/><text x="690" y="210" font-size="16" font-weight="700" fill="#1f3a6b" text-anchor="middle">11月末</text><text x="690" y="262.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="middle">12月分の月額</text><circle cx="910" cy="230" r="11" fill="#1f3a6b"/><text x="910" y="210" font-size="16" font-weight="700" fill="#1f3a6b" text-anchor="middle">12月末</text><text x="910" y="262.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="middle">1月分の月額</text><text x="30" y="344.0" font-size="20" font-weight="400" fill="#1c2433" text-anchor="start">乗り換え</text><text x="30" y="374.0" font-size="20" font-weight="400" fill="#1c2433" text-anchor="start">(初期費用0円)</text><line x1="250" y1="350" x2="910" y2="350" stroke="#5b6678" stroke-width="2"/><circle cx="470" cy="350" r="10" fill="#f3f6fb" stroke="#5b6678" stroke-width="2"/><text x="470" y="330" font-size="16" font-weight="400" fill="#5b6678" text-anchor="middle">10月末</text><text x="470" y="382" font-size="16" font-weight="400" fill="#5b6678" text-anchor="middle">請求なし</text><circle cx="690" cy="350" r="11" fill="#1f3a6b"/><text x="690" y="330" font-size="16" font-weight="700" fill="#1f3a6b" text-anchor="middle">11月末</text><text x="690" y="382.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="middle">12月分の月額</text><circle cx="910" cy="350" r="11" fill="#1f3a6b"/><text x="910" y="330" font-size="16" font-weight="700" fill="#1f3a6b" text-anchor="middle">12月末</text><text x="910" y="382.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="middle">1月分の月額</text><text x="600.0" y="426" font-size="20" font-weight="700" fill="#2e7d5b" text-anchor="middle">11月分の月額は無料。請求は12月分から始まります</text></svg>
