<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" role="img" aria-label="全体の流れ"><title>全体の流れ</title><rect width="1200" height="300" fill="#f3f6fb" rx="16"/><rect x="40" y="50" width="250" height="210" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="74" cy="84" r="20" fill="#1f3a6b"/><text x="74" y="92" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="106" y="93" font-size="28" font-weight="700" fill="#1f3a6b" text-anchor="start">契約</text><text x="60" y="134" font-size="18" font-weight="400" fill="#5b6678" text-anchor="start">当日</text><rect x="60" y="152" width="132" height="28" rx="14" fill="#1f3a6b"/><text x="126.0" y="174" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">店舗・KOKU</text><text x="60" y="212.0" font-size="18" font-weight="400" fill="#1c2433" text-anchor="start">LINEグループを作り、</text><text x="60" y="239.0" font-size="18" font-weight="400" fill="#1c2433" text-anchor="start">契約情報を記入する</text><line x1="296" y1="155" x2="314" y2="155" stroke="#5b6678" stroke-width="3"/><polygon points="310,147 324,155 310,163" fill="#5b6678"/><rect x="330" y="50" width="250" height="210" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="364" cy="84" r="20" fill="#1f3a6b"/><text x="364" y="92" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="396" y="93" font-size="28" font-weight="700" fill="#1f3a6b" text-anchor="start">準備</text><text x="350" y="134" font-size="18" font-weight="400" fill="#5b6678" text-anchor="start">1〜4日目</text><rect x="350" y="152" width="164" height="28" rx="14" fill="#1f3a6b"/><text x="432.0" y="174" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">店舗 → KOKU</text><text x="350" y="212.0" font-size="18" font-weight="400" fill="#1c2433" text-anchor="start">店舗がフォームに記入し、</text><text x="350" y="239.0" font-size="18" font-weight="400" fill="#1c2433" text-anchor="start">KOKUが設定する</text><line x1="586" y1="155" x2="604" y2="155" stroke="#5b6678" stroke-width="3"/><polygon points="600,147 614,155 600,163" fill="#5b6678"/><rect x="620" y="50" width="250" height="210" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="654" cy="84" r="20" fill="#1f3a6b"/><text x="654" y="92" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="686" y="93" font-size="28" font-weight="700" fill="#1f3a6b" text-anchor="start">導入日</text><text x="640" y="134" font-size="18" font-weight="400" fill="#5b6678" text-anchor="start">5日目が目安</text><rect x="640" y="152" width="132" height="28" rx="14" fill="#1f3a6b"/><text x="706.0" y="174" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">店舗・KOKU</text><text x="640" y="212.0" font-size="18" font-weight="400" fill="#1c2433" text-anchor="start">店舗に伺い、約2時間で使</text><text x="640" y="239.0" font-size="18" font-weight="400" fill="#1c2433" text-anchor="start">える状態にする</text><line x1="876" y1="155" x2="894" y2="155" stroke="#5b6678" stroke-width="3"/><polygon points="890,147 904,155 890,163" fill="#5b6678"/><rect x="910" y="50" width="250" height="210" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="944" cy="84" r="20" fill="#1f3a6b"/><text x="944" y="92" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="976" y="93" font-size="28" font-weight="700" fill="#1f3a6b" text-anchor="start">運用開始</text><text x="930" y="134" font-size="18" font-weight="400" fill="#5b6678" text-anchor="start">導入日の営業から</text><rect x="930" y="152" width="52" height="28" rx="14" fill="#2e7d5b"/><text x="956.0" y="174" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">店舗</text><text x="930" y="212.0" font-size="18" font-weight="400" fill="#1c2433" text-anchor="start">月額の先払いが始まる(1</text><text x="930" y="239.0" font-size="18" font-weight="400" fill=