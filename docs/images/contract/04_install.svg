<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" role="img" aria-label="導入日の流れ"><title>導入日の流れ</title><rect width="1200" height="300" fill="#f3f6fb" rx="16"/><text x="30" y="40" font-size="20" font-weight="700" fill="#1f3a6b" text-anchor="start">所要時間 約2時間</text><rect x="30" y="60" width="210" height="220" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="62" cy="94" r="20" fill="#1f3a6b"/><text x="62" y="102" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="46" y="150" font-size="20" font-weight="700" fill="#1f3a6b" text-anchor="start">アプリを入れる</text><text x="46" y="190.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">店舗のiPadに「ポッ</text><text x="46" y="214.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">キリ.Night」のア</text><text x="46" y="238.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">プリを入れる</text><line x1="243" y1="170" x2="249" y2="170" stroke="#5b6678" stroke-width="3"/><polygon points="245,162 259,170 245,178" fill="#5b6678"/><rect x="262" y="60" width="210" height="220" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="294" cy="94" r="20" fill="#1f3a6b"/><text x="294" y="102" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="278" y="150" font-size="20" font-weight="700" fill="#1f3a6b" text-anchor="start">ログイン</text><text x="278" y="190.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">その店舗のIDとパスワ</text><text x="278" y="214.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">ードを入力する</text><line x1="475" y1="170" x2="481" y2="170" stroke="#5b6678" stroke-width="3"/><polygon points="477,162 491,170 477,178" fill="#5b6678"/><rect x="494" y="60" width="210" height="220" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="526" cy="94" r="20" fill="#1f3a6b"/><text x="526" y="102" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="510" y="150" font-size="20" font-weight="700" fill="#1f3a6b" text-anchor="start">プリンターを接続</text><text x="510" y="190.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">店舗のプリンターと</text><text x="510" y="214.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">iPadをつなぐ</text><line x1="707" y1="170" x2="713" y2="170" stroke="#5b6678" stroke-width="3"/><polygon points="709,162 723,170 709,178" fill="#5b6678"/><rect x="726" y="60" width="210" height="220" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="758" cy="94" r="20" fill="#1f3a6b"/><text x="758" y="102" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="742" y="150" font-size="20" font-weight="700" fill="#1f3a6b" text-anchor="start">操作方法の説明</text><text x="742" y="190.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">フロア画面と管理画面の</text><text x="742" y="214.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">使い方を、動画を使って</text><text x="742" y="238.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">説明する</text><line x1="939" y1="170" x2="945" y2="170" stroke="#5b6678" stroke-width="3"/><polygon points="941,162 955,170 941,178" fill="#5b6678"/><rect x="958" y="60" width="210" height="220" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><circle cx="990" cy="94" r="20" fill="#1f3a6b"/><text x="990" y="102" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="974" y="150" font-size="20" font-weight="700" fill="#1f3a6b" text-anchor="start">質疑応答</text><text x="974" y="190.0" font-size="16" font-weight="400" fill="#1c2433" text-anchor="start">店舗からの質問に答える</text></svg>
