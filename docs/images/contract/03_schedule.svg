<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif" role="img" aria-label="契約日から導入日までのスケジュール"><title>契約日から導入日までのスケジュール</title><rect width="1200" height="330" fill="#f3f6fb" rx="16"/><text x="30" y="40" font-size="20" font-weight="400" fill="#5b6678" text-anchor="start">初期セットアップフォームの記入日から、3日以内に導入する</text><rect x="30" y="60" width="176" height="230" rx="12" fill="#ffffff" stroke="#1f3a6b" stroke-width="2"/><text x="118.0" y="100" font-size="24" font-weight="700" fill="#1f3a6b" text-anchor="middle">契約日</text><rect x="44" y="120" width="132" height="28" rx="14" fill="#1f3a6b"/><text x="110.0" y="142" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">店舗・KOKU</text><text x="44" y="178.0" font-size="17" font-weight="400" fill="#1c2433" text-anchor="start">契約・LINEグル</text><text x="44" y="203.5" font-size="17" font-weight="400" fill="#1c2433" text-anchor="start">ープ作成・</text><text x="44" y="229.0" font-size="17" font-weight="400" fill="#1c2433" text-anchor="start">フォーム送付</text><rect x="222" y="60" width="176" height="230" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><text x="310.0" y="100" font-size="24" font-weight="700" fill="#1f3a6b" text-anchor="middle">1日目</text><rect x="236" y="120" width="52" height="28" rx="14" fill="#2e7d5b"/><text x="262.0" y="142" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">店舗</text><text x="236" y="178.0" font-size="17" font-weight="400" fill="#1c2433" text-anchor="start">初期セットアップフ</text><text x="236" y="203.5" font-size="17" font-weight="400" fill="#1c2433" text-anchor="start">ォームに記入</text><rect x="414" y="60" width="176" height="230" rx="12" fill="#ffffff" stroke="#cfd8e6" stroke-width="2"/><text x="502.0" y="100" font-size="24" font-weight="700" fill="#1f3a6b" text-anchor="middle">2日目</text><rect x="428" y="120" width="52" height="28" rx="14" fill="#2e7d5b"/><text x="454